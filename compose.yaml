services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aprende_jugando
      MYSQL_USER: aprende_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      PORT: 3001
      DB_HOST: db
      DB_USER: aprende_app
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: aprende_jugando
      TEACHER_KEY: ${TEACHER_KEY:?Configura TEACHER_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  mysql_data:
